<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>واجد</title>
<meta name="description" content="واجد: التسيير ديال حانوت إصلاح التيليفونات">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="واجد">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--ink:#14201d;--muted:#64746f;--line:#e3e9e7;
  --brand:#0f766e;--brand-2:#14b8a6;--brand-ink:#fff;--soft:#e6f4f1;
  --in:#2563eb;--in-bg:#e8efff;--fix:#c2410c;--fix-bg:#fff1e7;
  --ready:#15803d;--ready-bg:#e5f7ea;--out:#57534e;--out-bg:#efeeec;
  --danger:#dc2626;--danger-bg:#fdecec;--warn:#b45309;--warn-bg:#fff6e0;
  --wa:#25d366;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1312;--card:#161e1c;--ink:#e8efed;--muted:#93a39e;--line:#26312e;
  --brand:#14b8a6;--brand-2:#2dd4bf;--brand-ink:#04211e;--soft:#12302c;
  --in:#7ea6ff;--in-bg:#17233d;--fix:#fb9a5b;--fix-bg:#33200f;
  --ready:#4ade80;--ready-bg:#11301c;--out:#c3bdb7;--out-bg:#262321;
  --danger:#f87171;--danger-bg:#3a1717;--warn:#fbbf24;--warn-bg:#33280c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0d1312;--card:#161e1c;--ink:#e8efed;--muted:#93a39e;--line:#26312e;
  --brand:#14b8a6;--brand-2:#2dd4bf;--brand-ink:#04211e;--soft:#12302c;
  --in:#7ea6ff;--in-bg:#17233d;--fix:#fb9a5b;--fix-bg:#33200f;
  --ready:#4ade80;--ready-bg:#11301c;--out:#c3bdb7;--out-bg:#262321;
  --danger:#f87171;--danger-bg:#3a1717;--warn:#fbbf24;--warn-bg:#33280c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top-row{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800}
.top h1{font-size:19px;margin:0;font-weight:800;flex:1;line-height:1.2}
.top h1 small{display:block;font-size:12px;font-weight:600;opacity:.8}
.icon-btn{border:0;background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.week div{background:rgba(255,255,255,.13);border-radius:12px;padding:7px 10px}
.week b{display:block;font-size:19px;line-height:1.2}
.week span{font-size:11.5px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px 16px}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button i{font-style:normal;font-size:21px;line-height:1.2}
nav.tabs button.on{color:var(--brand)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-size:16px;outline:none}
.search:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.6;margin:0 6px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tk{padding:12px 14px;cursor:pointer;display:block;width:100%;text-align:start}
.tk-top{display:flex;align-items:center;gap:8px}
.tk-no{font-weight:800;color:var(--muted);font-size:13px}
.tk-model{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-sub{color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.s-in{color:var(--in);background:var(--in-bg)}.s-fix{color:var(--fix);background:var(--fix-bg)}
.s-ready{color:var(--ready);background:var(--ready-bg)}.s-out{color:var(--out);background:var(--out-bg)}
.late{color:var(--danger);background:var(--danger-bg)}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:14.5px;border:0;width:100%;text-align:start;cursor:pointer}
.banner b{font-size:20px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:25;border:0;background:var(--brand);color:var(--brand-ink);
  font-weight:800;font-size:16px;padding:14px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(15,118,110,.35);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty i{font-style:normal;font-size:42px;display:block}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:700;font-size:15.5px;cursor:pointer;background:var(--soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:var(--wa);color:#05361a}
.btn.dan{background:var(--danger-bg);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btns .full{grid-column:1/-1}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:60;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.x{position:absolute;inset-inline-end:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font-size:15px;cursor:pointer}
.sheet h2{padding-inline-end:40px}
.sheet .grab+.x+.row{padding-inline-end:44px}
.sheet .grab+.x+.row h2{padding-inline-end:0}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:20px;margin:0 0 12px;font-weight:800}
.f{display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:500;outline:none;width:100%;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);font-weight:500}
.err{color:var(--danger);font-size:14px;font-weight:700;min-height:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center;font-weight:700;cursor:pointer;font-size:14.5px}
.opt i{font-style:normal;display:block;font-size:24px}
.opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:6px 0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.tl{display:flex;gap:6px;margin:12px 0 4px}
.tl div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.tl div::before{content:"";display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:4px}
.tl div.done::before{background:var(--brand)}
.tl div.done{color:var(--ink);font-weight:700}
.stat{padding:14px}
.stat .v{font-size:24px;font-weight:800;line-height:1.2}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--brand);color:#fff;border:0}
.big .l{color:rgba(255,255,255,.85)}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.line:first-child{border-top:0}
.pos{color:var(--ready)}.neg{color:var(--danger)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:14px 14px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:11px;color:var(--muted)}
.bars span{width:100%;background:var(--brand-2);border-radius:6px 6px 2px 2px;min-height:3px}
.bars div.cur span{background:var(--brand)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;cursor:pointer}
.qty b{min-width:28px;text-align:center;font-size:17px}
.low{border-color:var(--warn)}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));inset-inline:16px;z-index:90;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;
  text-align:center;transform:translateY(-150%);transition:transform .25s;max-width:520px;margin:0 auto}
.toast.on{transform:none}
.spacer{height:70px}
.f label.chip{flex-direction:row;align-items:center;color:var(--ink);font-size:14px;gap:6px}
.thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;font-size:26px}
.photo{border:2px dashed var(--line);border-radius:14px;min-height:90px;display:grid;place-items:center;color:var(--muted);font-weight:700;cursor:pointer;overflow:hidden;background:var(--bg);text-align:center;padding:4px}
.photo img{width:100%;max-height:260px;object-fit:cover;display:block}
.hero{width:100%;max-height:300px;object-fit:cover;border-radius:16px;margin-bottom:10px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill.match,.banner.match{background:var(--ready-bg);color:var(--ready)}
.pill.old{background:var(--warn-bg);color:var(--warn)}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="logo">و</div>
    <h1 id="shopTitle">واجد</h1>
    <button class="icon-btn" data-act="settings" aria-label="الإعدادات">⚙︎</button>
  </div>
  <div class="week" id="week"></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="tickets"><i>🔧</i>التيكيات</button>
  <button data-act="tab" data-tab="stock"><i>📦</i>الستوك</button>
  <button data-act="tab" data-tab="money"><i>💰</i>الحسابات</button>
  <button data-act="tab" data-tab="credit"><i>🤝</i>الكريدي</button>
  <button data-act="tab" data-tab="used"><i>📱</i>البيع</button>
</nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= Data ================= */
const KEY = 'wajed_v1';
const DAY = 864e5;
const DEF = {
  v: 1, seq: 1,
  settings: { shopName: '', shopPhone: '', shopAddr: '', warrantyDays: 30, usedWarrantyDays: 7, reminderDays: 3, lowStock: 1 },
  tickets: [], stock: [], credits: [], used: [], expenses: [], sales: [], wants: []
};
const clone = o => JSON.parse(JSON.stringify(o));
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.v) return Object.assign(clone(DEF), d, { settings: Object.assign({}, DEF.settings, d.settings) });
  } catch (e) {}
  return clone(DEF);
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('⚠️ ماقدرتش نحفظ البيانات'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(x) ? x : 0; };
const money = v => `<span class="num">${Math.round(n(v)).toLocaleString('fr-MA')}</span> درهم`;
const moneyTxt = v => `${Math.round(n(v)).toLocaleString('fr-MA')} درهم`;
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('fr-MA', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('fr-MA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
function ago(ts) {
  const m = Math.floor((now() - ts) / 6e4);
  if (m < 1) return 'دابا';
  if (m < 60) return `${m} دقيقة`;
  const hr = Math.floor(m / 60);
  if (hr < 24) return `${hr} ساعة`;
  const d = Math.floor(hr / 24);
  return d === 1 ? 'نهار' : d === 2 ? 'يوماين' : `${d} أيام`;
}
const startOfDay = (d = new Date()) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
const startOfWeek = (d = new Date()) => { const x = new Date(startOfDay(d)); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.getTime(); };
const startOfMonth = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), 1).getTime();
function waNum(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '212' + d.slice(1);
  if (d.length === 9 && /^[5-7]/.test(d)) d = '212' + d;
  return d;
}
function luhnOk(imei) {
  if (!/^\d{15}$/.test(imei)) return false;
  let s = 0;
  for (let i = 0; i < 15; i++) { let d = +imei[i]; if (i % 2) { d *= 2; if (d > 9) d -= 9; } s += d; }
  return s % 10 === 0;
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
const shopName = () => db.settings.shopName || 'الحانوت';
const fi = () => /^[\u0600-\u06ff]/.test(shopName()) ? 'ف' + shopName() : 'ف ' + shopName();

/* ================= Tickets logic ================= */
const ST = { in: 'تسلم', fix: 'فالإصلاح', ready: 'واجد', out: 'تسلم للكليان' };
const SRC = {
  stock: { i: '📦', t: 'من الستوك' },
  friend: { i: '🤝', t: 'من عند صاحبي' },
  bought: { i: '🛒', t: 'شريتها' },
  none: { i: '🚫', t: 'بلا قطعة' }
};
const tById = id => db.tickets.find(t => t.id === id);
const warrantyEnd = t => t.outAt ? t.outAt + (t.warrantyDays || 0) * DAY : 0;
const inWarranty = t => t.status === 'out' && t.warrantyDays > 0 && now() < warrantyEnd(t);
const isLate = t => t.status === 'ready' && now() - t.readyAt > db.settings.reminderDays * DAY;
const rest = t => Math.max(0, n(t.price) - n(t.advance));

function message(type, t, other) {
  const S = shopName(), name = !other && t.name ? ` ${t.name}` : '';
  const yours = other ? `التيليفون ديال ${t.name || 'الكليان'}` : 'التيليفون ديالك';
  const sig = `\n— ${S}${db.settings.shopPhone ? ' · ' + db.settings.shopPhone : ''}`;
  switch (type) {
    case 'in': return `السلام عليكم${name}،\nتوصلنا ب${yours} (${t.model}) ${fi()}.\nرقم التيكي: #${t.no}\nالمشكل: ${t.issue || '—'}${n(t.price) ? `\nالثمن التقريبي: ${moneyTxt(t.price)}` : ''}${n(t.advance) ? `\nالتسبيق: ${moneyTxt(t.advance)}` : ''}\nغادي نعلموك ملي يكون واجد ✅${sig}`;
    case 'ready': return `السلام عليكم${name}،\n${yours} (${t.model}) واجد ✅\nرقم التيكي: #${t.no}\nالثمن: ${moneyTxt(t.price)}${n(t.advance) ? `\nالتسبيق: ${moneyTxt(t.advance)}\nالباقي: ${moneyTxt(rest(t))}` : ''}\nمرحبا بيك تجي تاخدو 🙏${sig}`;
    case 'remind': return `السلام عليكم${name}،\nكنفكروك بلي ${yours} (${t.model}) واجد من ${fmtDate(t.readyAt)} وباقي كيتسناك عندنا.\nرقم التيكي: #${t.no}${sig}`;
    case 'out': return `شكرا${name} على الثقة 🙏\nالتيليفون (${t.model}) تسلم ليك.\n${t.warrantyDays > 0 ? `الضمانة: ${t.warrantyDays} يوم، حتى ل ${fmtDate(warrantyEnd(t))}.\nحتافظ على هاد الميساج.` : 'بلا ضمانة.'}\nرقم التيكي: #${t.no}${sig}`;
  }
  return '';
}
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function sendTo(phone, text, via) {
  const num = waNum(phone);
  if (!num) { toast('ماكاينش رقم التيليفون'); return; }
  if (via === 'sms') location.href = `sms:+${num}${isIOS ? '&' : '?'}body=${encodeURIComponent(text)}`;
  else window.open(`https://wa.me/${num}?text=${encodeURIComponent(text)}`, '_blank');
}
const hasContact = t => !!(t.phone || t.phone2);
const waType = t => t.status === 'ready' ? (isLate(t) ? 'remind' : 'ready') : t.status === 'out' ? 'out' : 'in';

/* ================= UI state ================= */
const ui = { tab: 'tickets', filter: 'active', q: '', period: 'week', sq: '', uq: '', usub: 'sale' };
try { const s = JSON.parse(sessionStorage.getItem('wajed_ui')); if (s) Object.assign(ui, s, { q: '', sq: '', uq: '' }); } catch (e) {}
const keepUI = () => { try { sessionStorage.setItem('wajed_ui', JSON.stringify(ui)); } catch (e) {} };

/* ================= Sheet ================= */
let sheetCtx = {};
function openSheet(html, ctx = {}) {
  sheetCtx = ctx;
  const s = $('#sheet');
  s.innerHTML = `<div class="grab"></div><button class="x" data-act="close" aria-label="سد">✕</button>${html}`;
  s.scrollTop = 0;
  s.classList.add('on'); $('#scrim').classList.add('on');
  const first = s.querySelector('[autofocus]');
  if (first && !('ontouchstart' in window)) setTimeout(() => first.focus(), 260);
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); sheetCtx = {}; }

/* ================= Render ================= */
function render() {
  $('#shopTitle').innerHTML = `واجد<small>${h(db.settings.shopName || 'دخل سمية الحانوت فالإعدادات ⚙︎')}</small>`;
  const w0 = startOfWeek();
  const wkIn = db.tickets.filter(t => t.createdAt >= w0).length;
  const wkOut = db.tickets.filter(t => t.status === 'out' && t.outAt >= w0);
  const wkProfit = wkOut.reduce((s, t) => s + n(t.price) - n(t.part?.cost), 0);
  $('#week').innerHTML = `
    <div><b class="num">${wkIn}</b><span>دخلو هاد السيمانة</span></div>
    <div><b class="num">${wkOut.length}</b><span>تسلمو هاد السيمانة</span></div>
    <div><b class="num">${Math.round(wkProfit).toLocaleString('fr-MA')}</b><span>ربح السيمانة</span></div>`;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  const views = { tickets: viewTickets, stock: viewStock, money: viewMoney, credit: viewCredit, used: viewUsed };
  $('#main').innerHTML = views[ui.tab]();
  keepUI();
}

/* ---------- Tickets view ---------- */
function ticketFilters() {
  const T = db.tickets;
  return [
    ['active', 'اللي خدامين', t => t.status !== 'out'],
    ['in', ST.in, t => t.status === 'in'],
    ['fix', ST.fix, t => t.status === 'fix'],
    ['ready', ST.ready, t => t.status === 'ready'],
    ['late', 'ما رجعوش', isLate],
    ['out', 'تسلمو', t => t.status === 'out'],
    ['warranty', 'فالضمانة', inWarranty],
    ['all', 'الكل', () => true]
  ].map(([k, l, f]) => ({ k, l, f, c: T.filter(f).length }));
}
function ticketCard(t) {
  const late = isLate(t);
  const pill = late ? `<span class="pill late">ما رجعش · ${ago(t.readyAt)}</span>` : `<span class="pill s-${t.status}">${ST[t.status]}</span>`;
  const when = t.status === 'out' ? (inWarranty(t) ? `🛡️ ضمانة حتى ${fmtDate(warrantyEnd(t))}` : `تسلم ${fmtDate(t.outAt)}`) : `⏱ ${ago(t.createdAt)}`;
  return `<button class="card tk" data-act="ticket" data-id="${t.id}">
    <div class="tk-top"><span class="tk-no num">#${t.no}</span><span class="tk-model">${h(t.model)}</span>${pill}</div>
    <div class="tk-sub"><span>👤 ${h(t.name || '—')}</span><span>${h(t.issue || '')}</span></div>
    <div class="tk-sub"><span>${when}</span>${n(t.price) ? `<span>💵 ${money(t.price)}</span>` : ''}</div>
  </button>`;
}
function viewTickets() {
  const fs = ticketFilters();
  const cur = fs.find(f => f.k === ui.filter) || fs[0];
  const q = ui.q.trim().toLowerCase();
  let list = db.tickets.filter(cur.f);
  if (q) list = db.tickets.filter(t => [t.no, t.name, t.phone, t.phone2, t.model, t.issue].join(' ').toLowerCase().includes(q));
  list.sort((a, b) => b.createdAt - a.createdAt);
  const late = db.tickets.filter(isLate).length;
  return `
    ${late && ui.filter !== 'late' ? `<button class="banner" data-act="filter" data-f="late"><b>📣</b><span class="grow"><span class="num">${late}</span> تيليفون واجدين وما رجعوش من كثر من ${db.settings.reminderDays} أيام. فكّرهم ←</span></button>` : ''}
    <input class="search" type="search" placeholder="🔎 قلب بالسمية، الرقم، التيليفون، #التيكي…" value="${h(ui.q)}" data-input="q">
    ${q ? '' : `<div class="chips">${fs.map(f => `<button class="chip ${f.k === cur.k ? 'on' : ''}" data-act="filter" data-f="${f.k}">${f.l}<em class="num">${f.c}</em></button>`).join('')}</div>`}
    <div class="list" id="tlist">${list.length ? list.map(ticketCard).join('') : `<div class="empty"><i>🔧</i>${db.tickets.length ? 'ماكاين حتى تيكي هنا' : 'مازال ماكاين حتى تيكي.<br>زيد الأول من البوطونة ⊕'}</div>`}</div>
    <div class="spacer"></div>
    <button class="fab" data-act="newTicket">＋ تيكي جديد</button>`;
}

  <form class="f" data-form="ticket" autocomplete="off">
    <input type="hidden" name="id" value="${h(e.id || '')}">
    <label>التيليفون (الماركة والموديل) *<input name="model" required value="${h(e.model)}" placeholder="مثلا: iPhone 11، Samsung A12" autofocus></label>

    <datalist id="issues">${['الشاشة مهرسة', 'ما كيشارجيش', 'البطارية', 'ما كيشعلش', 'طاح فالما', 'الكاميرا', 'الصوت / الميكرو', 'الكونيكتور ديال الشارج', 'Software / Flash', 'ما كيشدش الريزو'].map(x => `<option value="${x}">`).join('')}</datalist>

      <label>ديال شكون؟<input name="phone2Who" value="${h(e.phone2Who)}" placeholder="مثلا: خوه، مراتو" list="whos"></label>
    </div>
    <datalist id="whos">${['تيليفون آخر ديالو', 'خوه', 'ختو', 'باباه', 'ماماه', 'مراتو', 'راجلها', 'صاحبو'].map(x => `<option value="${x}">`).join('')}</datalist>
    <span class="hint" style="margin-top:-6px">التيليفون ديال الكليان غادي يبقى عندك، داكشي علاش زيد رقم ديال شي واحد قريب منو باش يوصلو "واجد".</span>
    <div class="two">
      <label>الثمن التقريبي<input name="price" inputmode="decimal" value="${e.price ? h(e.price) : ''}" placeholder="0"></label>
      <label>التسبيق<input name="advance" inputmode="decimal" value="${e.advance ? h(e.advance) : ''}" placeholder="0"></label>

    <label>الكود / الشيما ديال التيليفون<input name="code" value="${h(e.code)}" placeholder="اختياري"></label>

function ticketDetail(t) {
  const steps = ['in', 'fix', 'ready', 'out'];
  const idx = steps.indexOf(t.status);
  const p = t.part;
  const acts = [];
  if (t.status === 'in') acts.push(`<button class="btn" data-act="toFix" data-id="${t.id}">🔧 بدا الإصلاح</button>`, `<button class="btn pri" data-act="toReady" data-id="${t.id}">✅ واجد</button>`);
  if (t.status === 'fix') acts.push(`<button class="btn pri full" data-act="toReady" data-id="${t.id}">✅ واجد</button>`);
  if (t.status === 'ready') acts.push(`<button class="btn pri full" data-act="toOut" data-id="${t.id}">📦 تسلم للكليان</button>`);
  if (hasContact(t) && db.used.some(u => !u.soldAt)) acts.push(`<button class="btn full" data-act="offerPick" data-id="${t.id}">📱 عرض عليه تيليفون للبيع</button>`);
  if (t.status === 'out' && inWarranty(t)) acts.push(`<button class="btn full" data-act="warrantyBack" data-id="${t.id}">🛡️ رجع فالضمانة</button>`);
  const waLbl = { in: 'صيفط "توصلنا بيه"', ready: 'صيفط "واجد"', remind: 'فكّرو', out: 'صيفط الضمانة' }[waType(t)];
  acts.push(`<button class="btn wa full" data-act="wa" data-id="${t.id}">💬 ${waLbl}</button>`);
  return `<div class="row"><h2 class="grow">#<span class="num">${t.no}</span> · ${h(t.model)}</h2><span class="pill ${isLate(t) ? 'late' : 's-' + t.status}">${isLate(t) ? 'ما رجعش' : ST[t.status]}</span></div>
  <div class="tl">${steps.map((s, i) => `<div class="${i <= idx ? 'done' : ''}">${ST[s]}</div>`).join('')}</div>
  ${t.warrantyOf ? `<div class="hint">🛡️ رجوع فالضمانة ديال التيكي #${h(tById(t.warrantyOf)?.no ?? '?')}</div>` : ''}
  <dl class="kv">
    <dt>الكليان</dt><dd>${h(t.name || '—')}</dd>
    <dt>التيليفون</dt><dd>${t.phone ? `<a href="tel:${h(t.phone)}" class="num">${h(t.phone)}</a>` : '—'}</dd>
    ${t.phone2 ? `<dt>رقم آخر</dt><dd><a href="tel:${h(t.phone2)}" class="num">${h(t.phone2)}</a>${t.phone2Who ? ' · ' + h(t.phone2Who) : ''}</dd>` : ''}
    <dt>المشكل</dt><dd>${h(t.issue || '—')}</dd>
    ${t.code ? `<dt>الكود</dt><dd class="num">${h(t.code)}</dd>` : ''}
    <dt>الثمن</dt><dd>${money(t.price)}</dd>
    ${n(t.advance) ? `<dt>التسبيق</dt><dd>${money(t.advance)} · الباقي ${money(rest(t))}</dd>` : ''}
    ${p ? `<dt>القطعة</dt><dd>${SRC[p.src].i} ${SRC[p.src].t}${p.label ? ' · ' + h(p.label) : ''}${p.from ? ' · ' + h(p.from) : ''}${n(p.cost) ? ' · ' + money(p.cost) : ''}</dd>` : ''}
    ${p ? `<dt>الربح</dt><dd class="${n(t.price) - n(p.cost) >= 0 ? 'pos' : 'neg'}">${money(n(t.price) - n(p.cost))}</dd>` : ''}
    ${t.status === 'out' ? `<dt>الضمانة</dt><dd>${t.warrantyDays > 0 ? `${t.warrantyDays} يوم · حتى ${fmtDate(warrantyEnd(t))} ${inWarranty(t) ? '✅' : '(سالات)'}` : 'بلا ضمانة'}</dd>` : ''}
    <dt>تسلم</dt><dd class="num">${fmtDT(t.createdAt)}</dd>
    ${t.readyAt ? `<dt>واجد</dt><dd class="num">${fmtDT(t.readyAt)}</dd>` : ''}
    ${t.outAt ? `<dt>تسلم للكليان</dt><dd class="num">${fmtDT(t.outAt)}</dd>` : ''}
    ${t.notes ? `<dt>ملاحظات</dt><dd>${h(t.notes)}</dd>` : ''}
  </dl>
  <div class="btns">${acts.join('')}
    <button class="btn ghost" data-act="editTicket" data-id="${t.id}">✏️ تعديل</button>
    ${idx > 0 ? `<button class="btn ghost" data-act="stepBack" data-id="${t.id}">↩︎ رجع خطوة</button>` : `<button class="btn ghost" data-act="delTicket" data-id="${t.id}">🗑 حذف</button>`}
    ${idx > 0 ? `<button class="btn ghost full" data-act="delTicket" data-id="${t.id}">🗑 حذف التيكي</button>` : ''}
  </div>`;
}

function readySheet(t) {
  const items = db.stock.filter(s => s.qty > 0);
  const src = sheetCtx.src || '';
  return `<h2>واجد ✅ · #<span class="num">${t.no}</span> ${h(t.model)}</h2>
  <form class="f" data-form="ready">
    <div><div class="hint" style="margin-bottom:6px;font-weight:700">شنو القطعة اللي ركبتي؟ (إجباري)</div>
    <div class="opts">${Object.entries(SRC).map(([k, v]) => `<button type="button" class="opt ${src === k ? 'on' : ''}" data-act="pickSrc" data-src="${k}"><i>${v.i}</i>${v.t}</button>`).join('')}</div></div>
    ${src === 'stock' ? (items.length ? `<label>القطعة من الستوك<select name="stockId" required>${items.map(s => `<option value="${s.id}" ${s.model && t.model.toLowerCase().includes(s.model.toLowerCase()) ? 'selected' : ''}>${h(s.name)}${s.model ? ' · ' + h(s.model) : ''} (باقي ${s.qty})</option>`).join('')}</select><span class="hint">غادي تنقص وحدة من الستوك بوحدها.</span></label>` : `<div class="err">الستوك خاوي. زيد القطع ف📦 الستوك، ولا ختار شي حاجة أخرى.</div>`) : ''}
    ${src === 'friend' ? `<label>القطعة<input name="label" placeholder="مثلا: شاشة A12"></label>
      <div class="two"><label>من عند شكون؟ *<input name="from" required placeholder="سمية الحانوت" list="shops"></label><label>الثمن ديالها *<input name="cost" inputmode="decimal" required placeholder="0"></label></div>
      <datalist id="shops">${shopNames().map(s => `<option value="${h(s)}">`).join('')}</datalist>
      <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" name="toCredit" checked style="width:auto"> زيدها فالكريدي (عليا ليه)</label>` : ''}
    ${src === 'bought' ? `<div class="two"><label>القطعة<input name="label" placeholder="مثلا: بطارية"></label><label>شريتها ب *<input name="cost" inputmode="decimal" required placeholder="0"></label></div>` : ''}
    ${src ? `<div class="two"><label>الثمن للكليان<input name="price" inputmode="decimal" value="${n(t.price) || ''}" placeholder="0"></label>
      <label>الضمانة (أيام)<input name="warrantyDays" inputmode="numeric" value="${t.warrantyOf ? 0 : db.settings.warrantyDays}"></label></div>
      <button class="btn pri block" ${src === 'stock' && !items.length ? 'disabled style="opacity:.5"' : ''}>✅ أكّد: واجد</button>` : '<div class="hint">ختار وحدة باش تكمّل.</div>'}
  </form>`;
}

function outSheet(t) {
  return `<h2>تسليم #<span class="num">${t.no}</span> · ${h(t.model)}</h2>
  <form class="f" data-form="out">
    <div class="two"><label>الثمن النهائي<input name="price" inputmode="decimal" value="${n(t.price) || ''}"></label>
    <label>الضمانة (أيام)<input name="warrantyDays" inputmode="numeric" value="${t.warrantyDays ?? db.settings.warrantyDays}"></label></div>
    ${n(t.advance) ? `<div class="card stat"><div class="l">خاص الكليان يخلّص</div><div class="v">${money(rest(t))}</div><div class="hint">(خلّص تسبيق ${money(t.advance)})</div></div>` : ''}
    ${(() => { const acc = db.stock.filter(x => x.kind === 'acc' && x.qty > 0 && n(x.sellPrice));
      return acc.length ? `<div><div class="hint" style="font-weight:700;margin-bottom:6px">🛍️ اقترح عليه (بروتيكتور، كوك…): شنو زاد شرا؟</div>
      <div class="chips" style="flex-wrap:wrap;margin:0;padding:0">${acc.map(x => `<label class="chip" style="display:flex;align-items:center;gap:6px"><input type="checkbox" name="acc_${x.id}" style="width:auto;margin:0">${h(x.name)}${x.model ? ' · ' + h(x.model) : ''} <em class="num">${Math.round(n(x.sellPrice))}</em></label>`).join('')}</div></div>` : ''; })()}
    <button class="btn pri block">📦 أكّد التسليم</button>
  </form>`;
}

/* targets: [{ who, num, text }] */
function sendSheet(title, targets, note = '') {
  openSheet(`<h2>${title}</h2>
    <div class="card" style="padding:12px 14px;white-space:pre-wrap;font-size:14.5px">${h(targets[0]?.text || '')}</div>
    ${note ? `<p class="hint">${note}</p>` : ''}
    ${targets.map((x, i) => `<div class="sec">${h(x.who)} · <span class="num">${h(x.num)}</span></div>
      <div class="row" style="gap:8px">
        <button class="btn wa grow" data-act="sendRaw" data-i="${i}" data-via="wa">💬 واتساب</button>
        <button class="btn grow" data-act="sendRaw" data-i="${i}" data-via="sms">📩 SMS</button>
        <a class="btn" href="tel:${h(x.num)}" aria-label="عيّط">📞</a>
      </div>`).join('')}
    <button class="btn ghost block" style="margin-top:14px" data-act="close">ماشي دابا</button>`, { msgs: targets });
}
function askSend(t, type, title) {
  const atShop = t.status !== 'out';
  const targets = [];
  if (t.phone2) targets.push({ who: t.phone2Who || 'الرقم الآخر', num: t.phone2, text: message(type, t, true) });
  if (t.phone) targets.push({ who: 'الكليان' + (atShop && t.phone2 ? ' (التيليفون عندك)' : ''), num: t.phone, text: message(type, t, false) });
  const note = atShop && t.phone && !t.phone2 ? '⚠️ التيليفون ديال الكليان عندك فالحانوت. إلا ماعندوش الواتساب فشي جهاز آخر، الميساج غادي يوصلو غير ملي ياخدو. عيّط ليه ولا زيد رقم آخر فـ ✏️ تعديل.' : '';
  sendSheet(title || 'صيفط ميساج', targets, note);
}
const ticketTargets = (t, textFn) => {
  const r = [];
  if (t.phone2) r.push({ who: t.phone2Who || 'الرقم الآخر', num: t.phone2, text: textFn(true) });
  if (t.phone) r.push({ who: t.name || 'الكليان', num: t.phone, text: textFn(false) });
  return r;
};

/* ---------- Stock ---------- */
function viewStock() {
  const q = ui.sq.trim().toLowerCase();
  let list = db.stock.slice().sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  if (q) list = list.filter(s => (s.name + ' ' + (s.model || '')).toLowerCase().includes(q));
  const low = db.stock.filter(s => s.qty <= db.settings.lowStock).length;
  const value = db.stock.reduce((s, x) => s + x.qty * n(x.cost), 0);
  return `
    <div class="grid2"><div class="card stat"><div class="v num">${db.stock.reduce((s, x) => s + x.qty, 0)}</div><div class="l">قطعة فالستوك</div></div>
    <div class="card stat"><div class="v">${money(value)}</div><div class="l">القيمة ديال الستوك</div></div></div>
    ${low ? `<div class="banner" style="margin-top:12px;cursor:default"><b>⚠️</b><span><span class="num">${low}</span> قطعة قربات تسالا (≤ ${db.settings.lowStock})</span></div>` : '<div style="height:12px"></div>'}
    <input class="search" type="search" placeholder="🔎 قلب على قطعة…" value="${h(ui.sq)}" data-input="sq">
    <div class="list">${list.length ? list.map(s => `<div class="card tk ${s.qty <= db.settings.lowStock ? 'low' : ''}" style="cursor:default">
      <div class="row"><div class="grow" data-act="editStock" data-id="${s.id}" style="cursor:pointer">
        <div class="tk-model">${h(s.name)} ${s.qty <= db.settings.lowStock ? `<span class="tag">${s.qty ? 'قليلة' : 'سالات'}</span>` : ''}</div>
        <div class="tk-sub">${s.kind === 'acc' ? '<span>🛍️ أكسسوار</span>' : ''}${s.model ? `<span>📱 ${h(s.model)}</span>` : ''}${n(s.cost) ? `<span>شرا ${money(s.cost)}</span>` : ''}${n(s.sellPrice) ? `<span>بيع ${money(s.sellPrice)}</span>` : ''}</div>
        ${n(s.sellPrice) && s.qty > 0 ? `<button class="btn sm" style="margin-top:6px" data-act="quickSale" data-id="${s.id}">💵 بيع</button>` : ''}</div>
        <div class="qty"><button data-act="qty" data-id="${s.id}" data-d="-1" aria-label="نقص">−</button><b class="num">${s.qty}</b><button data-act="qty" data-id="${s.id}" data-d="1" aria-label="زيد">+</button></div>
      </div></div>`).join('') : `<div class="empty"><i>📦</i>${db.stock.length ? 'ماكاين والو' : 'الستوك خاوي. زيد القطع اللي عندك.'}</div>`}</div>
    <div class="spacer"></div>
    <button class="fab" data-act="newStock">＋ قطعة / أكسسوار</button>`;
}
function stockForm(s) {
  const e = s || {};
  return `<h2>${s ? 'تعديل القطعة' : 'قطعة جديدة'}</h2>
  <form class="f" data-form="stock" autocomplete="off"><input type="hidden" name="id" value="${h(e.id || '')}">

/* ---------- Money ---------- */
function periodRange() {
  const p = ui.period;
  if (p === 'day') return startOfDay();
  if (p === 'week') return startOfWeek();
  if (p === 'month') return startOfMonth();
  return 0;
}
function viewMoney() {
  const from = periodRange();
  const done = db.tickets.filter(t => t.status === 'out' && t.outAt >= from);
  const rev = done.reduce((s, t) => s + n(t.price), 0);
  const cost = done.reduce((s, t) => s + n(t.part?.cost), 0);
  const sold = db.used.filter(u => u.soldAt && u.soldAt >= from);
  const uProfit = sold.reduce((s, u) => s + n(u.sellPrice) - n(u.buyPrice), 0);
  const exps = db.expenses.filter(x => x.date >= from);
  const expT = exps.reduce((s, x) => s + n(x.amount), 0);
  const sl = db.sales.filter(x => x.date >= from);
  const sProfit = sl.reduce((s, x) => s + n(x.price) - n(x.cost), 0);
  const sCount = sl.reduce((s, x) => s + x.qty, 0);
  const net = rev - cost + uProfit + sProfit - expT;
  const bySrc = Object.keys(SRC).map(k => [k, done.filter(t => t.part?.src === k).length]);
  // last 8 weeks
  const w0 = startOfWeek();
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const a = w0 - i * 7 * DAY, b = a + 7 * DAY;
    weeks.push({ a, c: db.tickets.filter(t => t.status === 'out' && t.outAt >= a && t.outAt < b).length, cur: i === 0 });
  }
  const mx = Math.max(1, ...weeks.map(w => w.c));
  const periods = [['day', 'اليوم'], ['week', 'هاد السيمانة'], ['month', 'هاد الشهر'], ['all', 'الكل']];
  return `
    <div class="chips" style="padding-top:0">${periods.map(([k, l]) => `<button class="chip ${ui.period === k ? 'on' : ''}" data-act="period" data-p="${k}">${l}</button>`).join('')}</div>
    <div class="card stat big" style="margin-top:8px"><div class="l">الربح الصافي</div><div class="v">${money(net)}</div><div class="l">الإصلاح + المستعمل + الأكسسوار − المصاريف</div></div>
    <div class="grid2" style="margin-top:10px">
      <div class="card stat"><div class="v num">${done.length}</div><div class="l">تيليفون تصلح وتسلم</div></div>
      <div class="card stat"><div class="v">${money(rev)}</div><div class="l">المدخول ديال الإصلاح</div></div>
    </div>
    <div class="sec">التفصيل</div>
    <div class="card">
      <div class="line"><span>المدخول ديال الإصلاح</span><b>${money(rev)}</b></div>
      <div class="line"><span>ثمن القطع</span><b class="neg">− ${money(cost)}</b></div>
      <div class="line"><span>ربح الإصلاح</span><b class="pos">${money(rev - cost)}</b></div>
      <div class="line"><span>ربح المستعمل (<span class="num">${sold.length}</span> تباع)</span><b class="${uProfit >= 0 ? 'pos' : 'neg'}">${money(uProfit)}</b></div>
      <div class="line"><span>ربح الأكسسوار (<span class="num">${sCount}</span> تباع)</span><b class="${sProfit >= 0 ? 'pos' : 'neg'}">${money(sProfit)}</b></div>
      <div class="line"><span>المصاريف</span><b class="neg">− ${money(expT)}</b></div>
    </div>
    <div class="sec">القطع: منين جات</div>
    <div class="card">${bySrc.map(([k, c]) => `<div class="line"><span>${SRC[k].i} ${SRC[k].t}</span><b class="num">${c}</b></div>`).join('')}</div>
    <div class="sec">التيليفونات اللي تسلمو فكل سيمانة</div>
    <div class="card"><div class="bars">${weeks.map(w => `<div class="${w.cur ? 'cur' : ''}"><b class="num">${w.c}</b><span style="height:${(w.c / mx) * 70}%"></span><span style="background:none;min-height:0" class="num">${new Date(w.a).toLocaleDateString('fr-MA', { day: '2-digit', month: '2-digit' })}</span></div>`).join('')}</div><div style="height:10px"></div></div>
    <div class="row" style="margin:18px 2px 8px"><div class="sec grow" style="margin:0">المصاريف</div><button class="btn sm" data-act="newExpense">＋ مصروف</button></div>
    <div class="card">${exps.length ? exps.sort((a, b) => b.date - a.date).map(x => `<div class="line"><span>${h(x.label)} <span class="hint num">${fmtDate(x.date)}</span></span><span class="row"><b>${money(x.amount)}</b><button class="btn ghost sm" data-act="delExpense" data-id="${x.id}" aria-label="حذف">✕</button></span></div>`).join('') : '<div class="line hint">ماكاين حتى مصروف فهاد المدة (الكرا، الضو، الإنترنت…)</div>'}</div>
    <div style="height:20px"></div>`;
}

function shopBalance(shop) { return db.credits.filter(c => c.shop === shop).reduce((s, c) => s + (c.dir === 'they' ? 1 : -1) * n(c.amount), 0); }

/* ---------- Sales: used phones, client wants, accessories ---------- */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g, ' ').trim();
function wantMatches(w, u) {
  if (!w || w.done || !u || u.soldAt) return false;
  const toks = norm(w.model).split(' ').filter(Boolean);
  if (!toks.length) return false;
  const m = norm(u.model), words = m.split(' ');
  const ok = toks.every(t => words.includes(t) || (t.length >= 4 && m.includes(t)));
  if (!ok) return false;
  if (n(w.budget) && n(u.askPrice) && n(u.askPrice) > n(w.budget) * 1.1) return false;
  return true;
}
const matchingWants = u => db.wants.filter(w => wantMatches(w, u));
const daysIn = u => Math.floor(((u.soldAt || now()) - u.boughtAt) / DAY);
const sig = () => `\n— ${shopName()}${db.settings.shopPhone ? ' · ' + db.settings.shopPhone : ''}${db.settings.shopAddr ? '\n📍 ' + db.settings.shopAddr : ''}`;
function offerText(u, name) {
  const wd = db.settings.usedWarrantyDays;
  return `السلام عليكم${name ? ' ' + name : ''}،\nعندنا ${fi()}:\n📱 ${u.model}${u.notes ? '\n' + u.notes : ''}${n(u.askPrice) ? `\n💵 الثمن: ${moneyTxt(u.askPrice)}` : ''}${wd ? `\n✅ مضمون ${wd} يوم` : ''}\nإلا عجبك دوز تشوفو 🙏${sig()}`;
}
function receiptText(u) {
  const end = u.soldAt + (u.soldWarranty || 0) * DAY;
  return `🧾 وصل البيع · ${shopName()}\n\nالتيليفون: ${u.model}\nIMEI: ${u.imei}${u.imei2 ? '\nIMEI 2: ' + u.imei2 : ''}\nالثمن: ${moneyTxt(u.sellPrice)}\nالتاريخ: ${fmtDate(u.soldAt)}\n${u.soldWarranty ? `الضمانة: ${u.soldWarranty} يوم، حتى ل ${fmtDate(end)}` : 'بلا ضمانة'}\n\nحتافظ على هاد الميساج. شكرا على الثقة 🙏${sig()}`;
}
function listText() {
  const av = db.used.filter(u => !u.soldAt).sort((a, b) => n(a.askPrice) - n(b.askPrice));
  const wd = db.settings.usedWarrantyDays;
  return `📱 التيليفونات المتوفرة ${fi()}:\n\n${av.map(u => `• ${u.model}${n(u.askPrice) ? ' · ' + moneyTxt(u.askPrice) : ''}${u.notes ? ' (' + u.notes + ')' : ''}`).join('\n')}\n${wd ? `\n✅ كلهم مضمونين ${wd} يوم` : ''}${sig()}`;
}

/* photos & sharing */
function compressPhoto(file, max = 720) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function rrect(x, X, Y, W, H, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
function wrapLines(x, text, maxW) {
  const words = String(text).split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
let shareFile = null;
async function statusImage(u) {
  toast('⏳ كنوجد التصويرة…');
  try { await Promise.all([document.fonts.load('800 90px Cairo'), document.fonts.load('600 46px Cairo')]); } catch (e) {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const F = (w, sz) => `${w} ${sz}px Cairo, "Geeza Pro", "Noto Sans Arabic", sans-serif`;
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0f766e'); g.addColorStop(1, '#042f2e');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#5eead4'; x.font = F(800, 56); x.fillText('📱 للبيع', W / 2, 140);
  let y = 220;
  if (u.photo) {
    const img = await loadImg(u.photo), bw = 900, bh = 900, bx = (W - bw) / 2;
    const k = Math.max(bw / img.width, bh / img.height), dw = img.width * k, dh = img.height * k;
    x.save(); rrect(x, bx, y, bw, bh, 48); x.clip(); x.drawImage(img, bx + (bw - dw) / 2, y + (bh - dh) / 2, dw, dh); x.restore();
    y += bh + 90;
  } else { x.font = '320px sans-serif'; x.fillText('📱', W / 2, 560); y = 860; }
  x.fillStyle = '#fff'; x.font = F(800, 92);
  wrapLines(x, u.model, 960).slice(0, 2).forEach(l => { x.fillText(l, W / 2, y); y += 110; });
  if (u.notes) { x.font = F(600, 46); x.fillStyle = 'rgba(255,255,255,.85)'; wrapLines(x, u.notes, 940).slice(0, 2).forEach(l => { x.fillText(l, W / 2, y); y += 62; }); }
  if (n(u.askPrice)) {
    y += 80; x.font = F(800, 100); const pt = moneyTxt(u.askPrice), pw = x.measureText(pt).width + 120;
    x.fillStyle = '#fbbf24'; rrect(x, (W - pw) / 2, y - 80, pw, 160, 80); x.fill();
    x.fillStyle = '#1c1917'; x.fillText(pt, W / 2, y + 4); y += 130;
  }
  if (db.settings.usedWarrantyDays) { x.fillStyle = '#86efac'; x.font = F(700, 48); x.fillText(`✅ مضمون ${db.settings.usedWarrantyDays} يوم`, W / 2, Math.min(y + 40, 1660)); }
  x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0, H - 200, W, 200);
  x.fillStyle = '#fff'; x.font = F(800, 58); x.fillText(shopName(), W / 2, H - 140);
  x.font = F(600, 42); x.fillStyle = 'rgba(255,255,255,.9)';
  x.fillText([db.settings.shopPhone && '📞 ' + db.settings.shopPhone, db.settings.shopAddr && '📍 ' + db.settings.shopAddr].filter(Boolean).join('   ') || ' ', W / 2, H - 70);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  shareFile = new File([blob], `wajed-${u.id}.jpg`, { type: 'image/jpeg' });
  const url = URL.createObjectURL(blob);
  const canShare = navigator.canShare && navigator.canShare({ files: [shareFile] });
  openSheet(`<h2>📣 ستوري الواتساب</h2>
    <img src="${url}" alt="" style="width:100%;border-radius:14px;display:block">
    <div class="btns">${canShare ? '<button class="btn wa full" data-act="shareImg">📤 شارك (Statut / مجموعة / Instagram)</button>' : ''}
    <a class="btn full" href="${url}" download="wajed-${h(u.model)}.jpg">⬇️ سجّل التصويرة</a></div>
    <p class="hint">فالآيفون: إلا ماخدماتش، ضغط مطول على التصويرة ← Enregistrer، ومن بعد حطها فـ Statut ديال الواتساب.</p>`);
}

  unsell: d => {
    const u = db.used.find(x => x.id === d.id);
    if (!confirm('نلغيو البيع؟')) return;
    Object.assign(u, { soldAt: null, sellPrice: 0, buyer: '', buyerCin: '', buyerPhone: '' }); save(); render(); openSheet(usedDetail(u));
  },
  delUsed: d => { if (!confirm('نحذفو هاد التيليفون من السجل؟')) return; db.used = db.used.filter(u => u.id !== d.id); save(); closeSheet(); render(); },
  // data
  exportData: async () => {
    const name = `wajed-${new Date().toISOString().slice(0, 10)}.json`;
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'واجد: نسخة احتياطية' }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },
  resetAll: () => {
    if (!confirm('متأكد؟ غادي يتمسحو كاع البيانات من هاد التيليفون.')) return;
    if (prompt('كتب "مسح" باش تأكد') !== 'مسح') return;
    db = clone(DEF); save(); closeSheet(); render(); toast('تمسح كلشي');
  }
};
function undoPart(t) {
  const p = t.part; if (!p) return;
  if (p.src === 'stock') { const s = db.stock.find(x => x.id === p.stockId); if (s) s.qty++; }
  if (p.creditId) db.credits = db.credits.filter(c => c.id !== p.creditId);
  t.part = null;
}

/* ================= Forms ================= */
const F = {
  ticket: v => {
    const fields = { model: v.model.trim(), issue: v.issue.trim(), name: v.name.trim(), phone: v.phone.trim(), phone2: v.phone2.trim(), phone2Who: v.phone2Who.trim(), price: n(v.price), advance: n(v.advance), code: v.code.trim(), notes: v.notes.trim() };
    if (v.id) {
      const t = tById(v.id); Object.assign(t, fields); save(); render(); openSheet(ticketDetail(t), { id: t.id }); toast('تحفظ ✓');
    } else {
      const t = Object.assign({ id: uid(), no: db.seq++, status: 'in', createdAt: now() }, fields);
      db.tickets.push(t); save();
      ui.filter = 'active'; ui.q = ''; render();
      if (hasContact(t)) askSend(t, 'in', `✓ تسجل التيكي #${t.no}`); else { closeSheet(); toast(`✓ تسجل التيكي #${t.no}`); }
    }
  },
  ready: v => {
    const t = tById(sheetCtx.id), src = sheetCtx.src;
    if (!src) { toast('ختار القطعة الأول'); return; }
    const part = { src, cost: 0, label: '' };
    if (src === 'stock') {
      const s = db.stock.find(x => x.id === v.stockId);
      if (!s || s.qty < 1) { toast('هاد القطعة ماكايناش فالستوك'); return; }
      s.qty--; Object.assign(part, { stockId: s.id, label: s.name + (s.model ? ' · ' + s.model : ''), cost: n(s.cost) });
      if (s.qty <= db.settings.lowStock) setTimeout(() => toast(`⚠️ ${s.name}: باقي ${s.qty} فالستوك`), 2800);
    } else if (src === 'friend') {
      Object.assign(part, { label: v.label.trim(), from: v.from.trim(), cost: n(v.cost) });
      if (v.toCredit && part.cost > 0) {
        const c = { id: uid(), shop: part.from, dir: 'me', amount: part.cost, note: `${part.label || 'قطعة'} · تيكي #${t.no}`, date: now() };
        db.credits.push(c); part.creditId = c.id;
      }
    } else if (src === 'bought') {
      Object.assign(part, { label: v.label.trim(), cost: n(v.cost) });
    }
    t.part = part; t.price = n(v.price); t.warrantyDays = Math.max(0, parseInt(v.warrantyDays) || 0);
    t.status = 'ready'; t.readyAt = now(); if (!t.fixAt) t.fixAt = t.readyAt;
    save(); render();
    if (hasContact(t)) askSend(t, 'ready', `✅ #${t.no} واجد`); else { closeSheet(); toast(`✅ #${t.no} واجد`); }
  },
  out: v => {
    const t = tById(sheetCtx.id);
    t.price = n(v.price); t.warrantyDays = Math.max(0, parseInt(v.warrantyDays) || 0);
    t.status = 'out'; t.outAt = now();
    let extra = 0;
    Object.keys(v).filter(k => k.startsWith('acc_') && v[k]).forEach(k => { const it = db.stock.find(x => x.id === k.slice(4)); if (it) extra += recordSale(it, 1, n(it.sellPrice), t.id); });
    save(); render();
    if (extra) setTimeout(() => toast(`🛍️ + ${moneyTxt(extra)} أكسسوار`), 2700);
    if (hasContact(t)) askSend(t, 'out', `📦 #${t.no} تسلم`); else { closeSheet(); toast(`📦 #${t.no} تسلم`); }
  },
  stock: v => {
    const f = { name: v.name.trim(), model: v.model.trim(), kind: v.kind === 'acc' ? 'acc' : 'part', qty: Math.max(0, parseInt(v.qty) || 0), cost: n(v.cost), sellPrice: n(v.sellPrice) };
    if (v.id) Object.assign(db.stock.find(s => s.id === v.id), f); else db.stock.push(Object.assign({ id: uid() }, f));
    save(); closeSheet(); render(); toast('تحفظ ✓');
  },
  expense: v => { db.expenses.push({ id: uid(), label: v.label.trim(), amount: n(v.amount), date: now() }); save(); closeSheet(); render(); },
  credit: v => {
    const shop = v.shop.trim(); if (!shop || !n(v.amount)) { toast('عمّر السمية والمبلغ'); return; }
    db.credits.push({ id: uid(), shop, dir: v.dir === 'they' ? 'they' : 'me', amount: n(v.amount), note: v.note.trim(), date: now() });
    save(); render(); openSheet(shopSheet(shop), { shop }); toast('تزاد ✓');
  },
  used: (v, form) => {
    const imei = v.imei.replace(/\D/g, ''), imei2 = v.imei2.replace(/\D/g, '');
    const err = form.querySelector('#usedErr');
    if (imei.length !== 15) { err.textContent = 'IMEI خاصو يكون 15 رقم.'; return; }
    const dup = db.used.find(u => u.id !== v.id && (u.imei === imei || u.imei2 === imei));
    if (dup && !confirm(`⚠️ هاد IMEI ديجا مسجل (${dup.model}، من عند ${dup.seller}). نكملو؟`)) return;
    if (!luhnOk(imei) && !confirm('⚠️ هاد IMEI ماشي صحيح (الرقم الأخير ما كيتوافقش). نكملو؟')) return;
    const f = { model: v.model.trim(), imei, imei2, seller: v.seller.trim(), cin: v.cin.trim().toUpperCase(), sellerPhone: v.sellerPhone.trim(), buyPrice: n(v.buyPrice), askPrice: n(v.askPrice), notes: v.notes.trim(), photo: sheetCtx.photo || '' };
    let u;
    if (v.id) { u = db.used.find(x => x.id === v.id); Object.assign(u, f); }
    else { u = Object.assign({ id: uid(), boughtAt: now(), soldAt: null }, f); db.used.push(u); }
    save(); render(); openSheet(usedDetail(u));
    const m = matchingWants(u);
    toast(m.length ? `👥 ${m.length} كليان كيقلبو على بحال هادا!` : 'تسجل ✓');
  },
  sell: v => {
    const u = db.used.find(x => x.id === sheetCtx.id);
    Object.assign(u, { sellPrice: n(v.sellPrice), buyer: v.buyer.trim(), buyerCin: v.buyerCin.trim().toUpperCase(), buyerPhone: v.buyerPhone.trim(), soldWarranty: Math.max(0, parseInt(v.soldWarranty) || 0), soldAt: now() });
    save(); render(); toast('💵 تباع');
    if (u.buyerPhone) sendSheet('🧾 صيفط الوصل للمشتري', [{ who: u.buyer || 'المشتري', num: u.buyerPhone, text: receiptText(u) }], 'الوصل فيه IMEI والضمانة: كيعطي الثقة للمشتري وكيخليه يرجع عندك.');
    else openSheet(usedDetail(u));
  },
  want: v => {
    const f = { name: v.name.trim(), phone: v.phone.trim(), model: v.model.trim(), budget: n(v.budget), notes: v.notes.trim() };
    let w;
    if (v.id) { w = db.wants.find(x => x.id === v.id); Object.assign(w, f); } else { w = Object.assign({ id: uid(), createdAt: now(), done: false }, f); db.wants.push(w); }
    save(); ui.usub = 'wants'; render();
    const m = db.used.filter(u => wantMatches(w, u));
    if (m.length) { openSheet(wantForm(w)); toast('✅ عندك اللي كيقلب عليه!'); } else { closeSheet(); toast('✓ تسجل. غادي نعلمك ملي يوصل بحالو'); }
  },
  qsale: v => {
    const it = db.stock.find(x => x.id === sheetCtx.id);
    const q = Math.max(1, parseInt(v.qty) || 1);
    if (q > it.qty) { toast(`باقي غير ${it.qty}`); return; }
    recordSale(it, q, n(v.price)); save(); closeSheet(); render(); toast(`💵 تباع: ${moneyTxt(n(v.price) * q)}`);
  },
  settings: v => {
    Object.assign(db.settings, { shopName: v.shopName.trim(), shopPhone: v.shopPhone.trim(), shopAddr: v.shopAddr.trim(), usedWarrantyDays: Math.max(0, parseInt(v.usedWarrantyDays) || 0), warrantyDays: Math.max(0, parseInt(v.warrantyDays) || 0), reminderDays: Math.max(1, parseInt(v.reminderDays) || 3), lowStock: Math.max(0, parseInt(v.lowStock) || 0) });
    save(); closeSheet(); render(); toast('تحفظ ✓');
  }
};

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  if (el.tagName === 'A') e.preventDefault();
  A[el.dataset.act](el.dataset, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const v = {}; new FormData(f).forEach((val, k) => { v[k] = typeof val === 'string' ? val : ''; });
  f.querySelectorAll('input[type=checkbox]').forEach(c => { v[c.name] = c.checked; });
  F[f.dataset.form](v, f);
});
let inputT;
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  ui[k] = e.target.value;
  clearTimeout(inputT);
  inputT = setTimeout(() => {
    const pos = e.target.selectionStart;
    render();
    const el = document.querySelector(`[data-input="${k}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }, 180);
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-photo-input]')) {
    const f = e.target.files[0]; if (!f) return;
    compressPhoto(f).then(url => { sheetCtx.photo = url; const im = $('#sheet #photoPrev'); if (im) im.innerHTML = `<img src="${url}" alt="">`; }).catch(() => toast('ماقدرتش نقرا التصويرة'));
    return;
  }
  if (e.target.dataset.actChange !== 'importData') return;
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.v || !Array.isArray(d.tickets)) throw 0;
      if (!confirm(`نرجعو هاد النسخة؟ (${d.tickets.length} تيكي). البيانات اللي دابا غادي تتبدل.`)) return;
      db = Object.assign(clone(DEF), d, { settings: Object.assign({}, DEF.settings, d.settings) });
      save(); closeSheet(); render(); toast('✓ النسخة رجعات');
    } catch (_) { toast('⚠️ هاد الفيشي ماشي نسخة ديال واجد'); }
  };
  r.readAsText(file);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// refresh "ago" labels and reminders every minute
setInterval(() => { if (!$('#sheet').classList.contains('on') && document.activeElement?.tagName !== 'INPUT') render(); }, 60000);

render();
if (!db.settings.shopName && !db.tickets.length) setTimeout(() => { openSheet(settingsSheet()); toast('مرحبا 👋 بدا بسمية الحانوت'); }, 400);
</script>
</body>
